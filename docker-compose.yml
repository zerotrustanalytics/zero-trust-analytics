version: '3.8'

services:
  # Zero Trust Analytics Application
  zta:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* are baked into the client bundle at build time and must
        # match the runtime AUTH_MODE below. Empty API URL => same-origin /api.
        NEXT_PUBLIC_AUTH_MODE: ${AUTH_MODE:-oidc}
        NEXT_PUBLIC_API_URL: ""
    container_name: zero-trust-analytics
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persist SQLite database
      - zta-data:/app/data
      # Optional: Mount config for easy updates
      - ./docker/.env:/app/.env:ro
    environment:
      # Server Configuration
      NODE_ENV: production
      PORT: 3000
      SITE_URL: ${SITE_URL:-http://localhost:3000}

      # Database (using libSQL file mode for self-hosting)
      TURSO_DATABASE_URL: file:/app/data/analytics.db
      TURSO_AUTH_TOKEN: ""

      # Secret guarding the internal init-db call at startup (never exposed as a
      # route). Any non-empty value works; override in docker/.env if desired.
      INIT_DB_SECRET: ${INIT_DB_SECRET:-selfhost-init-db}

      # Self-hosted mode
      SELF_HOSTED: "true"

      # Authentication mode: oidc (gatekeep SSO, default) | password | none.
      # Must match the NEXT_PUBLIC_AUTH_MODE build arg above.
      AUTH_MODE: ${AUTH_MODE:-oidc}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}

      # gatekeep OIDC SSO (required when AUTH_MODE=oidc). Issuer is gatekeep's
      # canonical URL; the API verifies EdDSA JWTs against <issuer>/jwks.json and
      # enforces audience = GATEKEEP_CLIENT_ID. AUTH_SECRET signs the Auth.js
      # session cookie in the Next dashboard. Set all three in docker/.env.
      GATEKEEP_ISSUER: ${GATEKEEP_ISSUER:-https://auth.ztas.io}
      GATEKEEP_CLIENT_ID: ${GATEKEEP_CLIENT_ID:-zta}
      AUTH_SECRET: ${AUTH_SECRET}

      # Security Secrets (CHANGE THESE!)
      HASH_SECRET: ${HASH_SECRET}
      JWT_SECRET: ${JWT_SECRET}

      # Stripe (optional - for paid subscriptions)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}

      # Email Service (choose one)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@localhost}

      # Optional: Analytics Configuration
      ENABLE_REGISTRATION: ${ENABLE_REGISTRATION:-true}
      MAX_SITES_PER_USER: ${MAX_SITES_PER_USER:-5}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - zta-network

  # Optional: Nginx reverse proxy for SSL/HTTPS
  nginx:
    image: nginx:alpine
    container_name: zta-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - zta-static:/usr/share/nginx/html:ro
    depends_on:
      - zta
    networks:
      - zta-network
    profiles:
      - with-nginx

volumes:
  # Persistent storage for SQLite database
  zta-data:
    driver: local

  # Optional: Static files for nginx
  zta-static:
    driver: local

networks:
  zta-network:
    driver: bridge
