name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            app/package-lock.json
            netlify/functions/package-lock.json

      - name: Install Next.js dependencies
        working-directory: ./app
        run: npm ci

      - name: Run ESLint
        working-directory: ./app
        run: npm run lint

      - name: Run TypeScript type check
        working-directory: ./app
        run: npm run type-check

  test-functions:
    name: Test Netlify Functions
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: test-secret-key-for-ci
      TURSO_DATABASE_URL: file:test.db
      TURSO_AUTH_TOKEN: test-token

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            app/package-lock.json
            netlify/functions/package-lock.json

      - name: Install Netlify functions dependencies
        working-directory: ./netlify/functions
        run: npm ci

      - name: Run Netlify function tests
        working-directory: ./netlify/functions
        run: npm test

  build-nextjs:
    name: Build Next.js Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            app/package-lock.json
            netlify/functions/package-lock.json

      - name: Install Next.js dependencies
        working-directory: ./app
        run: npm ci

      - name: Build Next.js
        working-directory: ./app
        run: npm run build
        env:
          # Provide minimal env vars for build
          NEXT_PUBLIC_API_URL: https://example.com

  test-nextjs:
    name: Test Next.js Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            app/package-lock.json
            netlify/functions/package-lock.json

      - name: Install Next.js dependencies
        working-directory: ./app
        run: npm ci

      - name: Run unit tests
        working-directory: ./app
        run: npm run test:run

  integration:
    name: Integration (self-hosted server)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            netlify/functions/package-lock.json
            server/package-lock.json

      - name: Install API dependencies
        run: |
          (cd netlify/functions && npm ci)
          (cd server && npm ci)

      # Starts server/index.js on a throwaway libSQL file per test and drives it
      # over HTTP: gatekeep sign-in, ingest, retention purge, account erasure, ...
      - name: Run integration tests
        run: bash tests/integration/run.sh

  status-check:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint, test-functions, build-nextjs, test-nextjs, integration]

    steps:
      - name: All checks passed
        run: echo "All CI checks passed successfully!"
