{{ define "main" }}
<article class="sec" style="padding-top:56px">
  <div class="wrap stack" style="gap:28px;max-width:960px">
    <nav class="xs faint" aria-label="Breadcrumb"><a href="{{ "/vs/" | relURL }}" style="text-decoration:none">Compare</a> / {{ .Title }}</nav>
    {{/* The comparison content carries its own H1. */}}
    <div class="prose" style="max-width:none">{{ .Content }}</div>
    <aside class="card stack" style="padding:28px;gap:14px;background:var(--sun-soft)" aria-label="Try ZTA">
      <h2 class="h2">See it with your own traffic.</h2>
      <p class="muted">Unlimited sites on every plan, including Free. No cookies, no stored IPs.</p>
      <div class="row">
        <a class="btn btn-go" href="https://app.ztas.io/sign-up">Start free</a>
        <a class="btn" href="{{ "/pricing/" | relURL }}">See pricing</a>
      </div>
    </aside>
  </div>
</article>
{{ end }}
