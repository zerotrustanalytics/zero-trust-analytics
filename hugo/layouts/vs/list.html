{{ define "main" }}
<section class="sec" style="padding-top:64px">
  <div class="wrap stack" style="gap:40px">
    <header class="stack" style="gap:12px;max-width:760px">
      <span class="eyebrow">Compare</span>
      <h1 class="h1">How ZTA stacks up.</h1>
      <p class="lead">Honest side-by-sides with the analytics tools people usually weigh us against.</p>
    </header>
    <div class="g3">
      {{ range .Pages.ByTitle }}
      <a class="card post" href="{{ .RelPermalink }}" data-reveal>
        <span class="h3">{{ .Title }}</span>
        {{ with .Description }}<span class="sm muted">{{ . }}</span>{{ end }}
        <span class="link sm">Read the comparison</span>
      </a>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
